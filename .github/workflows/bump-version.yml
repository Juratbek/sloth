# Every PR merged into main bumps the patch version in package.json, so the About section's version
# tells apart one Sloth from the next. The bump is a commit of its own on main, pushed with the
# workflow's token; `[skip ci]` keeps CI from running on a change to one line of package.json.
name: Bump version
on:
  pull_request:
    types: [closed]
    branches: [main]
# Two merges close together must not race for the push: the second waits and rebases on the first.
concurrency:
  group: bump-version
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump the patch version and push it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(npm version patch --no-git-tag-version)
          git commit -am "chore: $version (PR #${{ github.event.pull_request.number }}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
